<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pojęcia — fiszki</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="dimmer"></div>

<div id="shell">

  <header>
    <span class="wordmark" id="wordmark">Pojęcia</span>
    <span class="spacer"></span>
    <div class="mode-switch" role="group" aria-label="Tryb wyświetlania">
      <button data-mode="day" aria-pressed="true">Dzień</button>
      <button data-mode="dusk" aria-pressed="false">Wieczór</button>
      <button data-mode="night" aria-pressed="false">Noc</button>
    </div>
  </header>

  <!-- ============ NAUKA ============ -->
  <section class="view" id="view-learn">
    <div class="session-bar">
      <span class="pill" id="pill-due">do powtórki <b>0</b></span>
      <span class="pill" id="pill-new">nowe <b>0</b></span>
      <span class="grow"></span>
      <span class="pill" id="pill-done">sesja <b>0</b></span>
    </div>
    <div class="track"><i id="track-fill" style="width:0%"></i></div>
    <div id="card-area"></div>
    <div class="controls" id="controls"></div>
  </section>

  <!-- ============ PRZEGLĄD ============ -->
  <section class="view hidden" id="view-browse">
    <input class="search" id="search" type="search" placeholder="Szukaj w talii" autocomplete="off" autocapitalize="off">
    <div id="browse-list" style="overflow-y:auto"></div>
  </section>

  <!-- ============ DODAWANIE ============ -->
  <section class="view hidden" id="view-add">
    <div id="add-form" style="overflow-y:auto"></div>
  </section>

  <!-- ============ STATYSTYKI I USTAWIENIA ============ -->
  <section class="view hidden" id="view-more">
    <div id="more-body" style="overflow-y:auto"></div>
  </section>

  <nav>
    <button id="nav-learn" aria-current="page"><span class="glyph">◆</span><span class="txt">Nauka</span></button>
    <button id="nav-browse"><span class="glyph">≡</span><span class="txt">Talia</span></button>
    <button id="nav-add"><span class="glyph">＋</span><span class="txt">Dodaj</span></button>
    <button id="nav-more"><span class="glyph">▤</span><span class="txt">Więcej</span></button>
  </nav>

</div>

<div id="toast"></div>

<script src="fsrs.js"></script>
<script src="config.js"></script>
<script src="cards.js" onerror="window.CARDS=window.CARDS||[]"></script>
<script src="progress.js" onerror="window.PROGRESS=window.PROGRESS||{cards:{}}"></script>
<script src="reviews.js" onerror="window.REVIEWS=window.REVIEWS||[]"></script>
<script src="app.js"></script>
</body>
</html>
